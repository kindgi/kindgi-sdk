name: Feature request
description: Something the SDK or the CLI could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The SDK is in preview: its APIs may change between `0.x` releases. Issues are welcome, and
        outside contributions aren't accepted, as
        [CONTRIBUTING.md](https://github.com/kindgi/kindgi-sdk/blob/main/CONTRIBUTING.md) says.

        A page the docs are missing goes in the Docs problem form.

        A security concern doesn't go here: report it privately, as
        [SECURITY.md](https://github.com/kindgi/kindgi-sdk/blob/main/SECURITY.md) says.
  - type: dropdown
    id: area
    attributes:
      label: Where would it go?
      options:
        - The CLI (@kindgi/cli or kindgi-cli)
        - A TypeScript package (@kindgi/*)
        - The Python SDK (kindgi)
        - The Java SDK (kindgi-client or kindgi-pack)
        - The Scala SDK (kindgi-pack-scala)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or the use case, in your own words, and how you work around it, if you do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The change you have in mind (an API, a command, a page). A code sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered

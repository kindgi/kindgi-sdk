name: Release

# Two paths, both gated:
#
# 1. push to main → Changesets opens / updates the "Version Packages" PR.
#    Nothing is published. Merging that PR bumps every @kindgi/* package
#    to the next shared version (fixed group) and writes CHANGELOGs.
#    The PR is opened with a short-lived token from the org's release
#    GitHub App (repo variable RELEASE_APP_CLIENT_ID, secret
#    RELEASE_APP_PRIVATE_KEY), not GITHUB_TOKEN: events caused by
#    GITHUB_TOKEN start no workflow runs, so the required CI checks would
#    never report on the PR. Changesets pushes through the GitHub API, so
#    its commits are signed and attributed to the App.
#    In Changesets pre mode (`.changeset/pre.json`) the versions are
#    release candidates, `X.Y.Z-rc.N`: see CONTRIBUTING.md, "Release
#    candidates".
# 2. workflow_dispatch → publish. Runs in the `npm-publish` environment
#    (required reviewer), authenticates to npm with trusted publishing
#    (OIDC — no tokens), and publishes every non-private package whose
#    current version is not yet on npm, with provenance, under the dist-tag
#    `latest`, or `next` for a release candidate. `dry-run: true` (the
#    default) builds, checks, and packs without publishing.
#
# npm trusted publisher settings per package: repository kindgi/kindgi-sdk,
# workflow `release.yml`, environment `npm-publish`.
#
# The same dispatch also publishes the Python SDK (`kindgi`, sdks/python) to
# PyPI, in the `pypi-publish` environment (required reviewer), with PyPI's
# trusted publishing (OIDC — no tokens) and attestations. Its version is the
# npm packages' (scripts/sync-python-version.mjs; the job checks it before
# it builds). A version PyPI already has is skipped.
# PyPI trusted publisher: project `kindgi`, owner `kindgi`, repository
# `kindgi-sdk`, workflow `release.yml`, environment `pypi-publish`.
#
# It also publishes `kindgi-cli` (sdks/python-cli): the CLI for Python
# developers, the npm package @kindgi/cli with Node from a wheel. Its wheel is
# built from the @kindgi/cli this dispatch just published to npm
# (scripts/build-cli-wheel.mjs --from-npm), so PyPI carries exactly npm's
# CLI; a dry run builds it from this commit's packed packages instead.
# PyPI trusted publisher: project `kindgi-cli`, owner `kindgi`, repository
# `kindgi-sdk`, workflow `release.yml`, environment `pypi-publish`.
#
# And it publishes the JVM SDKs (sdks/java, sdks/scala) to Maven Central,
# first: npm waits for them, since the CLI the npm job publishes scaffolds
# Java and Scala packs on kindgi-pack at its own version. Their version is
# the npm packages' (scripts/sync-jvm-version.mjs), rcs included. It runs in
# the `maven-publish` environment (required reviewer), which holds the Central
# Portal user token (secrets MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD),
# the signing key (secrets MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE) and
# the key's public fingerprint (variable MAVEN_GPG_FINGERPRINT). Maven and sbt
# stage the signed artifacts on disk; scripts/check-jars.mjs checks them and
# scripts/central-bundle.mjs uploads them as one deployment. A dry run has
# the Portal validate that deployment, then drops it: nothing is published.
# A version Central already has is skipped (Central's versions are permanent).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build, check, and pack only; do not publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-pr:
    name: Version Packages PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Writes go through the App token below; the job token only reads.
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `version-packages` gives the Python projects the packages' new version
      # (scripts/sync-python-version.mjs), and uv re-locks them. It moves the
      # JVM SDKs' poms too and stamps their changelog
      # (scripts/sync-jvm-version.mjs --release; text edits, no Maven).
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: sdks/python/pyproject.toml
          python-version: "3.13"
          cache-dependency-glob: sdks/python/uv.lock
          # With nothing to version (the push right after a Version
          # Packages merge), uv never runs and there's no cache to save:
          # not a failure.
          ignore-nothing-to-cache: true
      - uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ steps.app-token.outputs.token }}

  publish-maven:
    name: Publish the JVM SDKs to Maven Central
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: maven-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # The guard below lists the workspace's packages with pnpm (no install).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Central gets exactly the npm packages' version: `--check` fails when a
      # pom or version.sbt says anything else.
      - name: The version is the npm packages'
        run: node scripts/sync-jvm-version.mjs --check
      # Names only, never values: what's missing is named before anything builds.
      - name: The environment holds the token, the key and its fingerprint
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          missing=()
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE MAVEN_GPG_FINGERPRINT; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the maven-publish environment is missing: ${missing[*]}"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: sbt/setup-sbt@v1
      # A keyring of this job's own, deleted at its end: the key never reaches a file
      # outside it, and the passphrase reaches gpg only through Maven's and sbt's
      # environment.
      - name: The signing key, into a throwaway keyring
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build, test, sign and stage the Java SDK
        working-directory: sdks/java
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -P release deploy
      # kindgi-pack comes from the local Maven repository, where the step above put it.
      - name: Build, test, sign and stage the Scala layer (2.13, 3.3)
        working-directory: sdks/scala
        env:
          PGP_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: sbt -batch +test +publishSigned
      - name: What goes to Central (check-jars)
        run: node scripts/check-jars.mjs --signed --complete sdks/java/target/central-staging sdks/scala/target/sona-staging
      - name: The bundle, every signature the release key's
        env:
          MAVEN_GPG_FINGERPRINT: ${{ vars.MAVEN_GPG_FINGERPRINT }}
        run: |
          node scripts/central-bundle.mjs bundle --out "$RUNNER_TEMP/central-bundle.zip" \
            --fingerprint "$MAVEN_GPG_FINGERPRINT" \
            sdks/java/target/central-staging sdks/scala/target/sona-staging
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: ${{ runner.temp }}/central-bundle.zip
          retention-days: 30
      - name: The Portal validates the bundle, then it's dropped (dry run)
        if: ${{ inputs.dry-run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: node scripts/central-bundle.mjs validate --bundle "$RUNNER_TEMP/central-bundle.zip"
      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: node scripts/central-bundle.mjs publish --bundle "$RUNNER_TEMP/central-bundle.zip"
      - name: Delete the keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/gnupg"

  publish:
    name: Publish to npm
    # After Maven Central: a release's npm packages wait for its JVM artifacts. A dry
    # run goes on either way, so it reports npm's problems too.
    needs: publish-maven
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.dry-run || needs.publish-maven.result == 'success') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # push release tags
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1 (pnpm hands the tarball to npm).
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Publish-readiness (publint + attw)
        run: pnpm run check:publish
      # npm and PyPI release one version: the Python SDK's must be the same.
      - name: The Python SDK's version is the packages'
        run: pnpm run check:python-version
      # A pre-release (X.Y.Z-rc.N) publishes under `next`, a release under
      # `latest`: what an install without a version gets moves only for a
      # release. npm refuses a pre-release without a tag.
      - name: The npm dist-tag
        id: dist-tag
        run: echo "tag=$(node scripts/release-dist-tag.mjs)" >> "$GITHUB_OUTPUT"
      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        run: pnpm -r publish --dry-run --no-git-checks --tag "${{ steps.dist-tag.outputs.tag }}"
      # The CLI scaffolds Java and Scala packs on kindgi-pack at its own version: npm never
      # gets a CLI whose JVM artifacts don't resolve from Central (publish-maven ran first;
      # this waits out Central's sync, and stops a release that skipped it).
      - name: The JVM SDKs at the CLI's version are on Maven Central
        if: ${{ !inputs.dry-run }}
        run: node scripts/central-bundle.mjs on-central --version "$(node -p "require('./packages/cli/package.json').version")"
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm -r publish --no-git-checks --tag "${{ steps.dist-tag.outputs.tag }}"
      - name: latest is still a release
        if: ${{ !inputs.dry-run }}
        run: |
          for pkg in @kindgi/sdk @kindgi/cli; do
            latest=$(npm view "$pkg" dist-tags.latest)
            if [[ "$latest" == *-* ]]; then
              echo "::error::$pkg's latest is $latest, a pre-release: point it back with npm dist-tag add $pkg@<release> latest"
              exit 1
            fi
          done
      # `changeset git-tag` makes annotated tags, which need a committer
      # identity; without one every `git tag` fails while changesets still
      # reports the tags as created. The check reads them back from origin.
      - name: Tag released versions
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset git-tag
          git push origin --tags
          node scripts/check-release-tags.mjs

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC) + attestations
    steps:
      - uses: actions/checkout@v5
      # The guard below lists the workspace's packages with pnpm (no install).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # PyPI gets exactly the npm packages' version: `--check` fails when
      # pyproject.toml (or uv.lock) says anything else.
      - name: The version is the npm packages'
        run: node scripts/sync-python-version.mjs --check
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: sdks/python/pyproject.toml
          python-version: "3.13"
          cache-dependency-glob: sdks/python/uv.lock
      - name: Build the sdist and wheel
        working-directory: sdks/python
        run: uv build
      # Installers older than the metadata refuse the package (Poetry 1.8
      # reads up to 2.3); the same check as CI's.
      - name: The wheel's core metadata is 2.3
        working-directory: sdks/python
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep -qx 'Metadata-Version: 2.3'
      - name: The distribution's metadata renders on PyPI
        working-directory: sdks/python
        run: uvx twine check --strict dist/*
      - name: Publish
        if: ${{ !inputs.dry-run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true

  publish-pypi-cli:
    name: Publish kindgi-cli to PyPI
    if: github.event_name == 'workflow_dispatch'
    # The wheel carries the @kindgi/cli the npm job publishes.
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC) + attestations
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PyPI gets exactly the npm packages' version.
      - name: The version is the npm packages'
        run: node scripts/sync-python-version.mjs --check
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: sdks/python-cli/pyproject.toml
          python-version: "3.13"
          # Without it, setup-uv hashes its default glob (**/pyproject.toml,
          # **/uv.lock, **/*requirements*.txt, …) across the whole checkout,
          # node_modules included, for its cache key: about 23 minutes a run.
          cache-dependency-glob: sdks/python-cli/uv.lock
      # A dry run published nothing to npm: the wheel comes from this commit.
      - name: Build the wheel (dry run, from this checkout)
        if: ${{ inputs.dry-run }}
        run: |
          pnpm run build
          node scripts/build-cli-wheel.mjs --from-workspace --smoke
      - name: Build the wheel (from the @kindgi/cli just published)
        if: ${{ !inputs.dry-run }}
        run: node scripts/build-cli-wheel.mjs --from-npm "$(node -p "require('./packages/cli/package.json').version")" --smoke
      # Installers older than the metadata refuse the package (Poetry 1.8
      # reads up to 2.3); the same check as the Python SDK's.
      - name: The wheel's core metadata is 2.3
        run: |
          unzip -p sdks/python-cli/dist/*.whl '*.dist-info/METADATA' | grep -qx 'Metadata-Version: 2.3'
      - name: The distribution's metadata renders on PyPI
        run: uvx twine check --strict sdks/python-cli/dist/*
      - name: Publish
        if: ${{ !inputs.dry-run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python-cli/dist
          skip-existing: true

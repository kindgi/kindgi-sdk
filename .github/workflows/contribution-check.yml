name: Contribution check

# An outside contributor's pull request carries what the kindgi-contributing
# skill asks for: the checks that were run, the supervising person's
# `Supervised-by:` line and the agent's trailer (scripts/contribution-check.mjs).
# Only a fork's pull request is checked: a branch in this repository needs
# push access, so it's a maintainer's. (`author_association` can't tell: a
# private member of the org shows as CONTRIBUTOR here.)
#
# `pull_request_target` runs with this repository's token, so it never runs
# the pull request's code: it checks out the base commit's script only, and
# reads the pull request from the event and the API.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # The check comments on the pull request (through the issues API, which
  # needs pull-requests: write for a pull request).
  issues: write
  pull-requests: write

concurrency:
  group: contribution-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Contribution format
    runs-on: ubuntu-latest
    # A fork's pull request; a deleted fork has no head repository.
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          # The base commit's script, never the pull request's code.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/contribution-check.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check the pull request's format
        run: node scripts/contribution-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` fires when a draft is marked ready; the job-level
    # `if:` below skips runs while a PR is still a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue (T139): each queued PR is tested on top of main and the
  # PRs ahead of it, under the same job names the ruleset requires. This
  # trigger has to be on main before the queue is turned on.
  merge_group:
  # Every job runs on pull requests (not drafts), merge-queue groups, pushes
  # to main, and on a manual run (`gh workflow run ci.yml --ref <branch>`). One step stays on
  # the developer's machine: the docs tutorials, which run `kindgi dev` with
  # the private runtime image (`pnpm run docs:tutorials`, or all of CI with
  # `pnpm run ci:local`, before a release).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # pnpm's version comes from package.json `packageManager`; do not set a
  # `version:` on pnpm/action-setup (conflicts → ERR_PNPM_BAD_PM_VERSION).

jobs:
  checks:
    name: Lint + border + specs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with:
          # The docs-ship check diffs the branch against origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm run lint
      - name: Border check (self-contained packages)
        run: pnpm run check:border
      - name: License headers
        run: pnpm run check:headers

      - name: References (docs exist in this repository; no internal process notes)
        run: pnpm run check:refs

      - name: README package table
        run: pnpm run check:readme

      # The Python SDK ships with the npm packages' version (lockstep):
      # scripts/sync-python-version.mjs.
      - name: Python SDK version in step with the npm packages
        run: pnpm run check:python-version

      # Before 1.0, and while release candidates are out, a minor or major
      # changeset needs a `Release-decision:` line:
      # scripts/check-changeset-bumps.mjs.
      - name: Changesets move the release only by decision
        run: pnpm run check:changeset-bumps

      - name: Validate JSON Schemas (@kindgi/specs)
        run: pnpm run spec:validate

      - name: Docs ship with the change
        if: github.event_name == 'pull_request'
        run: pnpm run check:docs-ship

  # Independent of `checks` (no `needs:`) so a lint failure never hides
  # test results. Require both jobs in the main-branch ruleset.
  build-test:
    name: Build + typecheck + test + publish checks
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @kindgi/pack-conformance runs its suite against the Python SDK's
      # pack service too (sdks/python/.venv); without it that target skips.
      # The default cache-dependency-glob (`**/pyproject.toml`, `**/uv.lock`, …)
      # walks node_modules from the repo root: 11+ minutes on this job. The
      # SDK's lock is the only file the uv cache depends on.
      - uses: astral-sh/setup-uv@v6
        with:
          # The uv version: `[tool.uv] required-version` there.
          version-file: sdks/python/pyproject.toml
          python-version: "3.13"
          cache-dependency-glob: sdks/python/uv.lock
      - name: Python SDK environment (for the pack conformance suite)
        run: uv sync --project sdks/python --frozen
      - name: Build (prod-dependency topological order)
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck:all
      - name: Test
        run: pnpm run test:all
      # The release scripts' own tests (node:test); the Python version sync's
      # run uv, set up above.
      - name: Release scripts
        run: pnpm run test:scripts
      # kindgi-cli, the CLI for Python developers: its wheel builds from this
      # checkout, and `kindgi --version` runs with no Node on PATH.
      - name: The kindgi-cli wheel (from the workspace; no Node on PATH)
        run: node scripts/build-cli-wheel.mjs --from-workspace --smoke
      # The lower bounds in sdks/python/pyproject.toml are what an app's own
      # resolver may pick (an app may pin uvicorn 0.27), so the Python pack
      # service must pass conformance at them too, not only at the lock.
      - name: Pack conformance — the Python SDK at its dependency floors
        run: |
          uv venv /tmp/kindgi-floors
          uv pip install --python /tmp/kindgi-floors --resolution lowest-direct -e sdks/python
          KINDGI_CONFORMANCE_PYTHON=/tmp/kindgi-floors/bin/python pnpm --filter @kindgi/pack-conformance exec vitest run tests/python.test.ts tests/python-supervisor.test.ts
      - name: Publish-readiness (publint + attw on publishable packages)
        run: pnpm run check:publish
      # The documentation site (docs.kindgi.com) builds, with its link check
      # and search index, from the workspace built above.
      - name: Docs site
        run: pnpm run docs:build
      # Every sample that is a whole file compiles (TypeScript) or indexes
      # (Python).
      - name: Docs samples
        run: pnpm run docs:samples

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: sdks/python/pyproject.toml
          python-version: ${{ matrix.python }}
          cache-dependency-glob: sdks/python/uv.lock
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Pyright (strict)
        run: uv run pyright
      - name: kindgi-cli's launcher (pytest, from src)
        working-directory: sdks/python-cli
        run: PYTHONPATH=src uv run --no-project --with pytest pytest -q tests
      - name: Pytest
        run: uv run pytest
      # At the lowest versions the dependencies allow (the client generator,
      # a dev tool, needs newer ones: its check runs at the lock).
      - name: Pytest at the dependency floors
        if: matrix.python == '3.11'
        run: |
          uv venv /tmp/kindgi-floors
          # With the `verify` extra, so kindgi.exports is tested at its cryptography floor.
          uv pip install --python /tmp/kindgi-floors --resolution lowest-direct -e ".[verify]" "pytest>=8"
          /tmp/kindgi-floors/bin/python -m pytest -p no:cacheprovider -k "not in_step_with_openapi"
      - name: Generated client in step with openapi.json
        run: uv run python scripts/gen_client.py --check
      - name: Build the distribution (not published)
        run: uv build
      # Installers older than the metadata refuse the package (Poetry 1.8
      # reads up to 2.3) — see [tool.hatch.build.targets.wheel].
      - name: The wheel's core metadata is 2.3
        run: |
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep -qx 'Metadata-Version: 2.3'

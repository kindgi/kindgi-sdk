name: Java SDK

# The Java SDK (sdks/java): the code generator, kindgi-models and kindgi-client, built and tested
# on Java 17, then the client inside Spring Boot 3 and 4 apps. It runs when the Java SDK or the API
# document it's generated from changes. Not a required check yet.
on:
  push:
    branches: [main]
    paths:
      - "sdks/java/**"
      - "packages/api/openapi.json"
      - ".github/workflows/java.yml"
  pull_request:
    # `ready_for_review` fires when a draft is marked ready; the job's `if:` skips drafts.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "sdks/java/**"
      - "packages/api/openapi.json"
      - ".github/workflows/java.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java SDK (17)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test (generator golden tests, models, client, operation coverage)
        run: ./mvnw -B -ntp install
      - name: The client in Spring Boot apps (3.2, 3.5, 4.0, 4.1)
        run: |
          set -e
          for boot in 3:3.2.12 3:3.5.16 4:4.0.8 4:4.1.1; do
            echo "::group::Spring Boot ${boot#*:}"
            ./mvnw -B -ntp -Pcompat -pl "compat/spring-boot-${boot%%:*}" verify -Dspring-boot.version="${boot#*:}"
            echo "::endgroup::"
          done
